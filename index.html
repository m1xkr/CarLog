<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бортжурнал</title>
  <meta name="description" content="Учёт заправок и расходов на автомобиль с синхронизацией через Яндекс Диск">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Бортжурнал">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="vehicle" id="vehicleBtn" type="button"><span id="vehicleName">Бортжурнал</span></button>
    <div class="top-actions">
      <button class="sync" id="syncBtn" type="button" aria-label="Синхронизация"><i class="dot"></i><span id="syncText"></span></button>
      <button class="gear" id="gearBtn" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="overview" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0M12 13l4-4M3 17h18"/></svg><span>Обзор</span></button>
    <button data-tab="events">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 15l2.5 2.5L16 13"/></svg><span>События</span><b class="tab-badge" id="eventsBadge" hidden></b></button>
    <button data-tab="refuels">
      <svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M5 10h10M15 8l3 3v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg><span>Заправки</span></button>
    <button data-tab="expenses">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>Расходы</span></button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Статистика</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="report" id="report" hidden></div>

  <div class="boot-error" id="bootError" hidden>
    <b>Приложение не запустилось</b>
    <p>Скорее всего, телефон взял часть файлов из старой версии. Ваши записи хранятся отдельно и не пострадают.</p>
    <pre id="bootErrorText"></pre>
    <button type="button" id="bootFix">Обновить приложение</button>
  </div>
  <script>
    // Страховка от «белого экрана»: если модули не загрузились или упали при старте,
    // показываем ошибку и кнопку, которая чистит кэш оболочки (данные в localStorage не трогает).
    (function () {
      var errs = [];
      function show() {
        if (window.__carlogReady) return;
        document.getElementById('bootErrorText').textContent = errs.join('\n') || 'Нет ответа от модулей приложения';
        document.getElementById('bootError').hidden = false;
      }
      window.addEventListener('error', function (e) { errs.push((e.message || 'Ошибка') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); if (!window.__carlogReady) show(); }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(show, 6000);
      document.getElementById('bootFix').onclick = function () {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?v=' + Date.now()); });
      };
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
